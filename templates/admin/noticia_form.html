{% extends "base.html" %}

{% block title %}{{ 'Editar' if noticia else 'Nueva' }} Noticia - PolitiCore{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card-modern">
                <h4 class="fw-bold mb-4">
                    <i class="fas fa-{{ 'edit' if noticia else 'plus' }} text-primary me-2"></i>
                    {{ 'Editar' if noticia else 'Nueva' }} Noticia
                </h4>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Título</label>
                        <input type="text" class="form-control" name="titulo"
                            value="{{ noticia.titulo if noticia else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Descripción</label>
                        <textarea class="form-control" name="descripcion" rows="3"
                            required>{{ noticia.descripcion if noticia else '' }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Fecha</label>
                                <input type="date" class="form-control" name="fecha"
                                    value="{{ noticia.fecha if noticia else '' }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Icono (Font Awesome)</label>
                                <input type="text" class="form-control" name="icono"
                                    value="{{ noticia.icono if noticia else 'circle' }}"
                                    placeholder="Ej: star, vote-yea, gavel">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="activa" {% if not noticia or
                                        noticia.activa %}checked{% endif %}>
                                    <label class="form-check-label">Activa</label>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="destacada" {% if noticia and
                                        noticia.destacada %}checked{% endif %}>
                                    <label class="form-check-label">Destacada</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i> Guardar
                        </button>
                        <a href="{{ url_for('admin_noticias') }}" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left me-2"></i> Volver
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
