{% extends "base.html" %}

{% block title %}Nueva Sala de Clase - PolitiCore{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card-modern">
                <h4 class="fw-bold mb-4">
                    <i class="fas fa-plus-circle text-primary me-2"></i> Nueva Sala de Clase
                </h4>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre de la sala</label>
                        <input type="text" class="form-control" name="nombre" required placeholder="Ej: 4° Básico A">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Descripción</label>
                        <textarea class="form-control" name="descripcion" rows="3" placeholder="Describe tu sala..."></textarea>
                    </div>

                    <div class="alert alert-info">
                        <i class="fas fa-info-circle me-2"></i>
                        <small>Se generará un código único de 6 dígitos para que tus alumnos se unan.</small>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i> Crear sala
                        </button>
                        <a href="{{ url_for('profesor_salas') }}" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left me-2"></i> Volver
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
