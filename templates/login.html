{% extends "base.html" %}

{% block title %}Iniciar Sesión - PolitiCore{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card-modern">
                <div class="text-center mb-4">
                    <i class="fas fa-gem text-primary" style="font-size: 3rem;"></i>
                    <h3 class="fw-bold mt-2">Bienvenido de vuelta</h3>
                    <p class="text-muted">Inicia sesión para continuar aprendiendo</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0">
                                <i class="fas fa-envelope text-muted"></i>
                            </span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="tu@email.com"
                                required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0">
                                <i class="fas fa-lock text-muted"></i>
                            </span>
                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="fas fa-sign-in-alt me-2"></i> Iniciar Sesión
                    </button>
                </form>

                <hr class="my-4">

                <p class="text-center mb-0">
                    ¿No tienes cuenta?
                    <a href="{{ url_for('registro') }}" class="text-primary fw-semibold">Regístrate aquí</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
